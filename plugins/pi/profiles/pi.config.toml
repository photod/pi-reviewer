# Dedicated PI session profile.
#
# PI intentionally sends the selected source package to external OpenCode-Go/Kimi providers.
# This profile keeps approval with the human and enables network only for the workspace sandbox.
# Managed tenant policy still wins: installing this profile never authorizes a denied private-data export.
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
